<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>K8s Learning Todos</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 40px auto; padding: 0 16px; }
    form { display: flex; gap: 8px; }
    input[type=text] { flex: 1; padding: 8px; }
    li { display: flex; align-items: center; gap: 8px; padding: 6px 0; }
    li.done span { text-decoration: line-through; color: #888; }
    li span { flex: 1; cursor: pointer; }
    #status { font-size: 12px; color: #666; }
  </style>
</head>
<body>
  <h1>Todos</h1>
  <form id="form">
    <input type="text" id="title" placeholder="What needs doing?" required>
    <button>Add</button>
  </form>
  <ul id="list"></ul>
  <p id="status"></p>

  <script>
    const list = document.getElementById("list");

    async function api(path, options) {
      const res = await fetch("/api" + path, {
        headers: { "Content-Type": "application/json" },
        ...options,
      });
      return res.json();
    }

    async function load() {
      const todos = await api("/todos");
      list.innerHTML = "";
      for (const t of todos) {
        const li = document.createElement("li");
        if (t.done) li.className = "done";
        const span = document.createElement("span");
        span.textContent = t.title;
        span.onclick = async () => { await api(`/todos/${t.id}/toggle`, { method: "PUT" }); load(); };
        const del = document.createElement("button");
        del.textContent = "x";
        del.onclick = async () => { await api(`/todos/${t.id}`, { method: "DELETE" }); load(); };
        li.append(span, del);
        list.append(li);
      }
      const health = await api("/health");
      document.getElementById("status").textContent = "Served by backend pod: " + (health.pod || health.status);
    }

    document.getElementById("form").onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById("title");
      await api("/todos", { method: "POST", body: JSON.stringify({ title: input.value }) });
      input.value = "";
      load();
    };

    load();
  </script>
</body>
</html>
