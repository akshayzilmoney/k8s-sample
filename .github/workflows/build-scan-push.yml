name: Build, scan and push images

on:
  push:
    branches: [main]
    paths:
      - "learning-app/backend/**"
      - "learning-app/frontend/**"
      - ".github/workflows/build-scan-push.yml"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/akshayzilmoney/k8s-sample

jobs:
  build-scan-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        component: [backend, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (local only, not pushed yet)
        uses: docker/build-push-action@v6
        with:
          context: learning-app/${{ matrix.component }}
          load: true
          push: false
          tags: scan-target:${{ matrix.component }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,scope=${{ matrix.component }},mode=max

      # The job stops here if HIGH/CRITICAL vulnerabilities with a fix are found,
      # so nothing vulnerable gets pushed.
      - name: Trivy scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: scan-target:${{ matrix.component }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          format: table

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        uses: docker/build-push-action@v6
        with:
          context: learning-app/${{ matrix.component }}
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:sha-${{ github.sha }}
            ${{ env.IMAGE_PREFIX }}-${{ matrix.component }}:latest
          cache-from: type=gha,scope=${{ matrix.component }}
